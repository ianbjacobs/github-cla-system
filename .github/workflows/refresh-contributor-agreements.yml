name: Refresh Contributor Agreements

on:
  push:
    paths:
      - CLA_REGISTRY.yaml

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: refresh-contributor-agreements
  cancel-in-progress: true

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the updated default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Refresh open pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-contributor-agreements.mjs
