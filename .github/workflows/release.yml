name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Package source
        run: |
          git archive --format=zip --output=github-cla-actions-${GITHUB_REF_NAME}.zip HEAD
          sha256sum github-cla-actions-${GITHUB_REF_NAME}.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" github-cla-actions-${GITHUB_REF_NAME}.zip SHA256SUMS --generate-notes
