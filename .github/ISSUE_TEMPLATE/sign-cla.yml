name: Sign Contributor Agreement
description: Accept the repository's Contributor License Agreement
title: "[CLA] Contributor agreement"
labels:
  - agreement
  - pending-cla
body:
  - type: markdown
    attributes:
      value: |
        # Contributor License Agreement

        > **Repository configuration required**
        >
        > Maintainers must replace this placeholder with the complete legal terms from `.github/cla/agreement.md` before enabling the workflow. The Issue Form and canonical agreement file must contain the same agreement text.

        ## Agreement metadata

        - **Version:** 1.0
        - **Effective date:** _Set an effective date before enabling the workflow._

        ## Terms and conditions

        > **REQUIRED:** Replace this notice with the complete Contributor License Agreement terms approved for the project.

        ## Electronic acceptance

        Submitting this GitHub issue and selecting both required acceptance checkboxes constitutes the contributor's electronic acceptance of this Agreement. The authenticated GitHub account used to submit the issue is treated as the identity of the signer.

        The generated Agreement pull request records the immutable GitHub numeric user ID, GitHub user node ID, login, repository, agreement version and blob SHA, signing timestamp, issue number, and issue node ID. The agreement becomes authoritative only after a maintainer reviews and merges that pull request.
  - type: checkboxes
    id: acceptance
    attributes:
      label: Acceptance
      options:
        - label: I have read and agree to the Contributor License Agreement.
          required: true
  - type: checkboxes
    id: identity
    attributes:
      label: Identity confirmation
      options:
        - label: I am submitting this agreement for my own authenticated GitHub account.
          required: true
